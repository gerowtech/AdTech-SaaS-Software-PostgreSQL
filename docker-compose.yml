services:
  db:
    image: postgres:16-alpine
    container_name: adpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adpilot
      POSTGRES_USER: adpilot
      POSTGRES_PASSWORD: adpilot_dev_password
    ports:
      - "5432:5432"
    volumes:
      - adpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adpilot -d adpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  adpilot_pgdata:
